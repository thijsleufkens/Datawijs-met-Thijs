# Hypothese-tracker op Strongbad (hypothese.datawijs.nl via NPM, achter access-list
# "hypothese-demo"). Bron = ./app, neergezet door ../deploy.sh.
# Poort alleen op loopback + container-IP; nooit kaal publiceren (publiek IPv6!).
services:
  web:
    build: ./app
    container_name: hypothese-tracker
    ports:
      - "127.0.0.1:8906:3000"
      - "10.100.0.171:8906:3000"
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
    volumes:
      - ./data:/app/data   # SQLite + uploads; in restic
    restart: unless-stopped
